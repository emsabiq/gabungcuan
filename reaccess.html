<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Re-Access Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width:560px">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-3">Buka Akses Lagi</h1>
        <p class="text-secondary small">Masukkan nomor WhatsApp yang dipakai saat membeli. (Opsional: External ID)</p>
        <form id="f" class="row g-3" autocomplete="off">
          <div class="col-12">
            <label class="form-label">No. WhatsApp (format 62...)</label>
            <input id="wa" class="form-control" required pattern="^62[0-9]{8,15}$" placeholder="62xxxxxxxxxx">
          </div>
          <div class="col-12">
            <label class="form-label">External ID (opsional)</label>
            <input id="eid" class="form-control" placeholder="INV-... (jika tahu)">
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-dark" type="submit">Buka Akses</button>
          </div>
          <div class="col-12">
            <div id="msg" class="small text-secondary"></div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="./assets/config.js"></script>
  <script>
    const form = document.getElementById('f');
    const msg  = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // ⬅️ penting: cegah form open JSON
      const WB = window.CONFIG.WORKER_BASE;
      const wa  = document.getElementById('wa').value.trim();
      const eid = document.getElementById('eid').value.trim();

      msg.textContent = 'Memeriksa pembelian...';
      try {
        const r = await fetch(`${WB}/api/renew`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wa, eid })
        });
        const j = await r.json();
        if (!j.ok || !j.access_token) {
          msg.textContent = 'Tidak ditemukan/Belum paid. Pastikan WA & External ID benar.';
          return;
        }
        // Navigasi GET ke redeem → cookie set → 302 ke /view
        const redeemUrl = `${WB}/redeem?token=${encodeURIComponent(j.access_token)}`;
        try { location.assign(redeemUrl); } catch(_) { window.open(redeemUrl, '_self'); }
        msg.innerHTML = `Membuka akses... <a href="${redeemUrl}">Klik di sini jika tidak otomatis</a>`;
      } catch (err) {
        console.error(err);
        msg.textContent = 'Terjadi kendala. Coba lagi sebentar.';
      }
    });
  </script>
</body>
</html>
