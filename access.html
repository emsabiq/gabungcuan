<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Akses Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="card mx-auto shadow-sm border-0 rounded-4" style="max-width:720px">
      <div class="card-body p-5 text-center">
        <h1 class="h4 fw-bold mb-3">Akses Produk Digital</h1>
        <p id="gate" class="text-secondary mb-3">Menyiapkan akses...</p>
        <div class="spinner-border" role="status" aria-hidden="true"></div>
        <div id="fallback" class="mt-3"></div>
      </div>
    </div>
  </main>

  <script src="./assets/config.js"></script>
  <script>
    (async () => {
      const token = new URLSearchParams(location.search).get('token');
      const WB = window.CONFIG.WORKER_BASE;
      const gate = document.getElementById('gate');
      const fb   = document.getElementById('fallback');

      if (!token) { gate.textContent = 'Token tidak ditemukan.'; return; }

      const url = `${WB}/redeem?token=${encodeURIComponent(token)}`;
      // Navigasi top-level (cookie HttpOnly pasti terset) → Worker redirect ke /view
      try { location.assign(url); } catch(_) { window.open(url, '_self'); }
      fb.innerHTML = `<a class="btn btn-outline-dark" href="${url}">Klik di sini jika tidak otomatis</a>`;
    })();
  </script>
</body>
</html>
