<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pembayaran Berhasil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="card mx-auto shadow-sm border-0 rounded-4" style="max-width:720px">
      <div class="card-body p-5 text-center">
        <div class="display-5 mb-3">✅</div>
        <h1 class="h4 fw-bold mb-2">Terima kasih! Pembayaran berhasil</h1>
        <p class="text-secondary mb-4">Sedang memverifikasi pembayaran...</p>
        <div id="verifWrap" class="mb-3"><div class="spinner-border" role="status"></div></div>
        <a id="btnAkses" href="#" class="btn btn-dark btn-lg rounded-3 d-none">Buka Akses Produk</a>
        <div id="info" class="small text-secondary mt-3"></div>
        <div id="fallback" class="mt-3"></div>
      </div>
    </div>
  </main>

  <script src="./assets/config.js"></script>
  <script src="./assets/pixel.js" defer></script>
  <script>
    (async () => {
      const qs = new URLSearchParams(location.search);
      const eid = qs.get('eid');
      const sig = qs.get('sig');
      const WB  = window.CONFIG.WORKER_BASE;
      const info = (t)=>{ const el=document.getElementById('info'); if(el) el.textContent=t; };

      if (!eid || !sig) { info('Parameter tidak lengkap.'); return; }

      const verifyOnce = async () => {
        const res = await fetch(`${WB}/api/verify?eid=${encodeURIComponent(eid)}&sig=${encodeURIComponent(sig)}`);
        if (!res.ok) return { ok:false };
        return await res.json();
      };

      // Polling max 60 dtk (tiap 2 dtk)
      let paid = null;
      for (let i=0;i<30;i++){
        try {
          const r = await verifyOnce();
          if (r.ok && r.status === 'PAID') { paid = r; break; }
        } catch {}
        await new Promise(r=>setTimeout(r,2000));
        info('Menunggu konfirmasi pembayaran...');
      }

      if (!paid) {
        info('Belum terverifikasi sebagai PAID. Jika sudah bayar, coba ulang beberapa detik lagi.');
        document.getElementById('verifWrap').classList.add('d-none');
        const re = document.createElement('a');
        re.href = './reaccess.html';
        re.className = 'btn btn-outline-dark';
        re.textContent = 'Buka Akses via Re-Access';
        document.getElementById('fallback').appendChild(re);
        return;
      }

      try { window.safeTrack('Purchase', { value: paid.amount, currency: 'IDR' }); } catch(_){}

      const btn = document.getElementById('btnAkses');
      btn.href  = `./access.html?token=${encodeURIComponent(paid.access_token)}`;
      btn.classList.remove('d-none');
      document.getElementById('verifWrap').classList.add('d-none');
      info('Pembayaran terverifikasi. Silakan buka akses.');
    })();
  </script>
</body>
</html>
