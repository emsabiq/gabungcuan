<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pembayaran Berhasil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="card mx-auto shadow-sm border-0 rounded-4" style="max-width:720px">
      <div class="card-body p-5 text-center">
        <div class="display-5 mb-3">✅</div>
        <h1 class="h4 fw-bold mb-2">Terima kasih! Pembayaran berhasil</h1>
        <p class="text-secondary mb-3">Kami sedang menyiapkan akses & <b>mengirim email</b> berisi tombol buka akses.</p>
        <div id="verifWrap" class="mb-3"><div class="spinner-border" role="status"></div></div>
        <div id="info" class="small text-secondary mb-3">Jika email belum masuk, cek folder Spam/Promosi.</div>
        <a href="./reaccess.html" class="btn btn-outline-dark">Buka Akses via Re-Access</a>
      </div>
    </div>
  </main>

  <script src="./assets/config.js"></script>
  <script src="./assets/pixel.js" defer></script>
  <script>
    (async () => {
      const qs = new URLSearchParams(location.search);
      const eid = qs.get('eid'); const sig = qs.get('sig');
      const WB = window.CONFIG.WORKER_BASE;
      if (!eid || !sig) return;

      // Polling verify biar kita tahu sudah PAID (untuk track & UX)
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      for (let i=0;i<15;i++){ // ~30 detik
        try {
          const r = await fetch(`${WB}/api/verify?eid=${encodeURIComponent(eid)}&sig=${encodeURIComponent(sig)}`);
          const j = await r.json();
          if (j.ok && j.status === 'PAID') {
            try { window.safeTrack?.('Purchase', { value:j.amount, currency:'IDR' }); } catch(_){}
            document.getElementById('verifWrap').classList.add('d-none');
            document.getElementById('info').textContent = 'Pembayaran terverifikasi. Email akses sudah/akan terkirim sesaat lagi.';
            return;
          }
        } catch {}
        await sleep(2000);
      }
      document.getElementById('verifWrap').classList.add('d-none');
      document.getElementById('info').textContent = 'Belum terverifikasi. Jika sudah bayar, tunggu 1–2 menit lalu gunakan Re-Access.';
    })();
  </script>
</body>
</html>
