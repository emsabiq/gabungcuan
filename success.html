<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pembayaran Berhasil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/pixel.js" defer></script>
</head>
<body>
  <main class="container py-5" style="max-width:720px;">
    <div class="text-center mb-4">
      <div class="display-6">✅ Pembayaran Berhasil</div>
      <p class="text-muted mb-0">Silakan <b>cek email</b> kamu untuk menerima <b>link akses materi</b>.</p>
      <p class="text-muted">Jika belum masuk, periksa folder <b>Spam/Promotions</b>. Kendala? WhatsApp: <a id="waHelp" href="#">085156042869</a></p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Status Pembayaran</h2>
        <div id="statusBox" class="alert alert-success d-flex align-items-center" role="alert">
          <div>
            <div class="fw-semibold" id="statHeadline">Email akses telah/akan dikirim</div>
            <div class="small text-muted" id="statDetail">Silakan cek Inbox/Spam/Promotions. Kendala? hubungi WhatsApp kami.</div>
          </div>
        </div>
        <a class="btn btn-dark" href="/">Kembali ke Beranda</a>
      </div>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script>
    (function(){
      // set link WA
      const waHelp = document.getElementById('waHelp');
      if (waHelp) waHelp.href = "https://wa.me/" + (CONFIG.SUPPORT_WA_E164 || "6285156042869");

      // Fire Pixel Purchase sekali per sesi & per EID
      const qs  = new URLSearchParams(location.search);
      const eid = qs.get('eid') || 'no-eid';
      const firedKey = 'purchase-fired:' + eid;

      if (!sessionStorage.getItem(firedKey)) {
        try {
          const val = Number(localStorage.getItem('lastPrice') || CONFIG.PRODUCT_DEFAULT.price || 0) || 0;
          if (window.fbq) {
            fbq('track', 'Purchase', {
              value: val,
              currency: 'IDR',
              content_name: CONFIG.PRODUCT_DEFAULT.name,
              content_type: 'product'
            });
          }
        } catch(_) {}
        sessionStorage.setItem(firedKey, '1');
      }
    })();
  </script>
</body>
</html>
